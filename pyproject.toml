[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-agent"
version = "0.3.0"
description = "Durable LLM-agent workflow engine: Temporal for durability, LangGraph for orchestration, schema-validated self-correction, Langfuse tracing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adarsh Singh" }]
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.7",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "httpx>=0.27",
    "grpcio>=1.60",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "grpcio-tools>=1.60"]

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
